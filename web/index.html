<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Deep Research Agent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DEEP RESEARCH WORKSPACE</p>
      <h1>股票研究 Agent</h1>
      <p>用自然语言发起研究任务，查看并行编排过程，并生成可下载综合报告。</p>
    </header>

    <section class="composer card">
      <textarea id="query">比较英伟达、阿里巴巴和英特尔最近三个月的表现，并结合我上传的材料重点比较风险。</textarea>
      <div class="actions">
        <label class="file-button">上传补充材料<input id="files" type="file" multiple accept=".pdf,.txt,.md"></label>
        <span id="file-summary">未选择文件</span>
        <button id="run-button">开始研究</button>
      </div>
    </section>

    <section id="run-overview" class="card hidden">
      <div class="section-title"><h2>研究计划</h2><span id="run-status" class="pill"></span></div>
      <p id="run-message"></p>
      <div id="task-understanding" class="understanding"></div>
    </section>

    <section id="stock-grid" class="stock-grid"></section>

    <section id="comparison-card" class="card hidden">
      <div class="section-title"><h2>横向比较</h2></div>
      <div id="comparison"></div>
    </section>

    <section id="report-card" class="card hidden">
      <div class="section-title">
        <h2>综合研究报告</h2>
        <button id="download-button" class="secondary">下载 Markdown</button>
      </div>
      <pre id="report"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
