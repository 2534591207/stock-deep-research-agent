notes: |
  Round 3 closes most of the previous review: readable answers/results APIs,
  snapshot and citation lineage, deterministic routing/invalidation, mutation
  locking, automatic atomic compression, Markdown-only scope, SymbolCatalog,
  MarketPolicy, demo-data warnings, and an explicit risk table are all materially
  improved.

  The following blockers remain before Tasks:

  1. Resolve the immutable/state contradiction. StockResult components contain
     mutable valid/invalidated_reason fields and ReportVersion contains a mutable
     active/stale/superseded status, while the design says these entities are
     immutable. Components also lack component_id although InvalidatedPart and
     RerunPlan reference component IDs. Define immutable component/report content
     plus a separate mutable workspace validity/lifecycle ledger, or explicitly
     define which metadata may mutate.

  2. Complete the core result/read contract. StockResult currently omits an
     explicit ObservedMarketRisk component. The API also does not clearly expose
     current quote, normalized price series/chart data, or dereferenceable market
     snapshots, although these are core PRD outputs. RunState/front-end require
     is_demo_data, but RunState does not explicitly carry it.

  3. Define long-running follow-up semantics. POST /messages promises an immediate
     answer, but a scope-changing follow-up starts a 10-30 second asynchronous
     research operation. Choose and specify either blocking response semantics or
     202/accepted + polling + answer-ready state. State exactly when active_op is
     acquired/released for initial research, follow-ups, uploads, and report
     regeneration.

  4. Finish the upload/asset contract. SessionAsset is returned by an API but has
     no schema; the plan references GET /uploads although no such endpoint exists.
     The lifecycle needs failure-from-any-stage and needs_clarification/unattached
     behavior. "May trigger report regeneration" conflicts with AC-29's mandatory
     regeneration for an attached analyzed upload. Add validation behavior for
     unsupported MIME/type and files over 10MB.

  5. Repair the formal harness contract before claiming the gate passed. CORE-05,
     workflow.md, reviewer.md, and the L2 playbook still require design.md, while
     the change intentionally removes it. Either add a thin design.md that points
     to backend/plan.md or consistently amend the harness rules. Also align
     check-workflow-state.sh (current_change) with phase.yaml/analyst.md
     (change_name); the current sensor reports "nothing to validate" and therefore
     does not prove the L2 artifact gate.

  Strong recommendations that may be completed with the blockers:
  - Make the supported US exchange/MIC allowlist explicit/configured instead of
    using an ellipsis in the catalog filter.
  - Add acceptance checks for source/freshness/demo-data transparency and upload
    size/type rejection.
  - Bound current-session memory growth with upload-count/report-version limits or
    a documented run cleanup policy.
